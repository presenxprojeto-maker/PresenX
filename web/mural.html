<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avisos - PresenX - CETEP / LNAB</title>
  <link rel="icon" type="image/svg+xml" href="./assets/presenx-icon.svg" />

  <!-- Google Fonts: Bricolage Grotesque & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #F4F0EA;
      --card-white: #FFFFFF;
      --brand-navy: #101a4a;
      --brand-blue: #203BA2;
      --text-dark: #101828;
      --text-body: #374151;
      --text-muted: #64748B;
      --border-line: #E5E1D8;
      --border-input: #D1D5DB;

      --prio-urgente: #DC2626;
      --prio-atencao: #D97706;
      --prio-info: #203BA2;
      --prio-normal: #475569;

      --font-display: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-page);
      font-family: var(--font-body);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .main-container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 32px 48px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ─── TOPO / CABEÇALHO ─── */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 32px 0;
      flex-wrap: wrap;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      color: var(--brand-navy);
      letter-spacing: -0.6px;
      display: inline-flex;
      align-items: center;
    }

    .logo-x-symbol {
      width: 24px;
      height: 24px;
      display: inline-block;
      vertical-align: middle;
      margin-left: 2px;
    }

    .brand-subtitle {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-link {
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
      transition: color 0.15s ease;
      cursor: pointer;
    }

    .nav-link:hover {
      color: var(--brand-blue);
    }

    .nav-pill-active {
      background-color: var(--brand-blue);
      color: #FFFFFF !important;
      padding: 7px 18px;
      border-radius: 8px;
      font-weight: 600;
    }

    .header-datetime {
      font-family: var(--font-body);
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 4px;
    }

    /* ─── SEÇÃO TÍTULO + BUSCA ─── */
    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(38px, 5vw, 48px);
      font-weight: 800;
      color: var(--brand-navy);
      line-height: 1.05;
      letter-spacing: -1.2px;
    }

    .page-subtitle {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 6px;
    }

    .search-wrap {
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background: #FFFFFF;
      border: 1.5px solid var(--border-input);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(32, 59, 162, 0.12);
    }

    .search-input::placeholder {
      color: #9CA3AF;
    }

    /* ─── FILTROS POR CHIP ─── */
    .filter-chips-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .filter-chips-row::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #FFFFFF;
      border: 1.5px solid var(--border-input);
      color: #374151;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .filter-btn:hover {
      background: #FAF8F5;
      border-color: #9CA3AF;
    }

    .filter-btn.active {
      background: var(--brand-navy);
      border-color: var(--brand-navy);
      color: #FFFFFF;
    }

    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--border-line);
      margin-bottom: 32px;
    }

    /* ─── CONTEÚDO PRINCIPAL (DUAS COLUNAS) ─── */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 48px;
      align-items: start;
      transition: all 0.2s ease;
    }

    .content-grid.sem-eventos {
      grid-template-columns: 1fr;
    }

    /* ─── COLUNA ESQUERDA: LISTA DE AVISOS ─── */
    .avisos-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Cards de Avisos com Alto Destaque e Elevação */
    .aviso-item {
      background: var(--card-white);
      border-radius: 16px;
      padding: 24px 28px;
      border: 1.5px solid rgba(16, 26, 74, 0.08);
      box-shadow: 0 4px 18px rgba(16, 26, 74, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .aviso-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(16, 26, 74, 0.09);
    }

    /* Borda lateral colorida de destaque de acordo com a prioridade */
    .aviso-item.urgente {
      border-color: rgba(220, 38, 38, 0.35);
      border-left: 6px solid var(--prio-urgente);
      box-shadow: 0 6px 22px rgba(220, 38, 38, 0.08), 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .aviso-item.atencao {
      border-color: rgba(217, 119, 6, 0.35);
      border-left: 6px solid var(--prio-atencao);
      box-shadow: 0 6px 22px rgba(217, 119, 6, 0.07), 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .aviso-item.informativo {
      border-color: rgba(32, 59, 162, 0.25);
      border-left: 6px solid var(--prio-info);
      box-shadow: 0 6px 22px rgba(32, 59, 162, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .aviso-item.normal {
      border-color: rgba(71, 85, 105, 0.22);
      border-left: 6px solid var(--prio-normal);
      box-shadow: 0 6px 22px rgba(71, 85, 105, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
    }

    .aviso-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .pill-prioridade {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3.5px 12px;
      border-radius: 20px;
      color: #FFFFFF;
      letter-spacing: 0.3px;
    }

    .pill-urgente {
      background-color: var(--prio-urgente);
    }

    .pill-atencao {
      background-color: var(--prio-atencao);
    }

    .pill-informativo {
      background-color: var(--prio-info);
    }

    .pill-normal {
      background-color: var(--prio-normal);
    }

    .aviso-datas-texto {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .aviso-titulo {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: var(--brand-navy);
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .aviso-item.urgente .aviso-titulo {
      font-size: 25px;
    }

    .aviso-corpo {
      font-family: var(--font-body);
      font-size: 15.5px;
      color: var(--text-body);
      line-height: 1.65;
      white-space: pre-line;
      word-break: break-word;
    }

    /* Estado Vazio para Avisos */
    .avisos-vazio {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14.5px;
      background: var(--card-white);
      border: 1.5px dashed var(--border-line);
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(16, 26, 74, 0.03);
    }

    /* ─── COLUNA DIREITA: PRÓXIMOS EVENTOS ─── */
    .eventos-col {
      display: flex;
      flex-direction: column;
    }

    .eventos-titulo-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .eventos-titulo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--brand-navy);
      letter-spacing: -0.4px;
      margin-bottom: 0;
    }

    .eventos-link-calendario {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brand-blue);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(32, 59, 162, 0.08);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .eventos-link-calendario:hover {
      background: rgba(32, 59, 162, 0.15);
      transform: translateX(2px);
    }

    .eventos-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .evento-item {
      background: var(--card-white);
      border-radius: 14px;
      padding: 16px 18px;
      border: 1.5px solid rgba(16, 26, 74, 0.08);
      box-shadow: 0 3px 12px rgba(16, 26, 74, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .evento-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 26, 74, 0.08);
      border-color: rgba(16, 26, 74, 0.16);
    }

    .evento-meta-linha {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .evento-data-badge {
      display: inline-flex;
      align-items: center;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--brand-blue);
      background: rgba(32, 59, 162, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .evento-cat-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.2px;
    }

    .evento-titulo-texto {
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 700;
      color: var(--brand-navy);
      line-height: 1.3;
    }

    .evento-sublinha {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.4;
    }

    .eventos-vazio {
      padding: 24px;
      text-align: center;
      background: var(--card-white);
      border-radius: 12px;
      border: 1px dashed var(--border-line);
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* ─── RODAPÉ INFERIOR ─── */
    .page-footer {
      margin-top: auto;
      padding-top: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
      font-family: var(--font-body);
      flex-wrap: wrap;
    }

    /* ─── RESPONSIVIDADE ─── */
    @media (max-width: 900px) {
      .main-container {
        padding: 18px 16px 40px 16px;
      }

      .site-header {
        padding: 8px 0 20px 0;
        gap: 12px;
      }

      .brand-title {
        font-size: 22px;
      }

      .header-nav {
        gap: 8px;
        flex-wrap: wrap;
      }

      .nav-link {
        font-size: 13px;
        padding: 5px 8px;
      }

      .nav-pill-active {
        padding: 5px 12px;
        font-size: 13px;
      }

      .header-datetime {
        display: none;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .title-row {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        margin-bottom: 18px;
      }

      .page-title {
        font-size: 32px;
        letter-spacing: -0.8px;
      }

      .search-wrap {
        width: 100%;
      }

      .filter-chips-row {
        display: flex;
        flex-wrap: nowrap;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        gap: 8px;
        padding-bottom: 8px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .filter-chips-row::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 12.5px;
        padding: 6px 14px;
        touch-action: pan-x;
      }

      .divider-line {
        margin-bottom: 22px;
      }

      .aviso-item {
        padding: 20px 20px;
        border-radius: 14px;
      }

      .aviso-titulo {
        font-size: 20px;
      }

      .aviso-corpo {
        font-size: 14.5px;
      }

      .evento-item {
        padding: 14px 16px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>

  <main class="main-container">

    <!-- CABEÇALHO SUPERIOR -->
    <header class="site-header">
      <a href="./login-gestao.html" class="brand-group" title="Ir para a página inicial">
        <span class="brand-title">
          <span>Presen</span>
          <svg class="logo-x-symbol" viewBox="0 0 84 84" fill="none" aria-label="X">
            <line x1="12" y1="28" x2="49" y2="65" stroke="#101a4a" stroke-width="8.8" stroke-linecap="round"/>
            <path d="M 6 58 L 20 72 L 48 31" stroke="#283e9b" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 50 18 A 14.5 14.5 0 0 1 61 29" stroke="#283e9b" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <path d="M 54 8 A 26.5 26.5 0 0 1 74 28" stroke="#283e9b" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span class="brand-subtitle">CETEP / LNAB</span>
      </a>

      <nav class="header-nav">
        <a href="./login-gestao.html" class="nav-link">Início</a>
        <a href="./painel.html" class="nav-link">Painel de salas</a>
        <a href="./mural.html" class="nav-link nav-pill-active">Avisos</a>
        <a href="./calendario.html" class="nav-link">Calendário</a>
        <a href="./login-gestao.html#cardLogin" class="nav-link">Gestão</a>
        <span class="header-datetime" id="txtDataHoraCabecalho">Quarta-feira, 4 de novembro</span>
      </nav>
    </header>

    <!-- TÍTULO E CAMPO DE BUSCA -->
    <section class="title-row">
      <div>
        <h1 class="page-title">Avisos</h1>
        <p class="page-subtitle" id="txtSubtituloContagem">Consultando avisos ativos...</p>
      </div>

      <div class="search-wrap">
        <input 
          type="text" 
          id="inputBusca" 
          class="search-input" 
          placeholder="Buscar aviso" 
          autocomplete="off"
        />
      </div>
    </section>

    <!-- BOTÕES DE FILTRO -->
    <section class="filter-chips-row">
      <button type="button" class="filter-btn active" data-filtro="todos">Todos</button>
      <button type="button" class="filter-btn" data-filtro="urgente">Urgentes</button>
      <button type="button" class="filter-btn" data-filtro="alta">Atenção</button>
      <button type="button" class="filter-btn" data-filtro="informativo">Informativos</button>
    </section>

    <!-- LINHA DIVISÓRIA -->
    <div class="divider-line"></div>

    <!-- CONTEÚDO PRINCIPAL EM DUAS COLUNAS -->
    <div class="content-grid">

      <!-- COLUNA PRINCIPAL: AVISOS -->
      <section class="avisos-col">
        <div id="listaAvisosContainer" class="avisos-list">
          <!-- Renderizado dinamicamente via JS -->
        </div>
      </section>

      <!-- COLUNA LATERAL: PRÓXIMOS EVENTOS -->
      <aside class="eventos-col" id="colunaEventos">
        <div class="eventos-titulo-wrap">
          <h2 class="eventos-titulo">Próximos eventos</h2>
          <a href="./calendario.html" class="eventos-link-calendario" title="Ver calendário escolar completo">
            Ver calendário &rarr;
          </a>
        </div>
        <div id="listaEventosContainer" class="eventos-lista">
          <!-- Renderizado dinamicamente via JS -->
        </div>
      </aside>

    </div>

    <!-- RODAPÉ -->
    <footer class="page-footer">
      <span id="txtAtualizadoHora">Atualizado às --:--:--</span>
      <span>PresenX · CETEP / LNAB</span>
    </footer>

  </main>

  <script>
    // Estado da aplicação
    let avisos = [];
    let eventos = [];
    let filtroAtual = "todos";
    let termoBusca = "";

    // Elementos DOM
    const el = {
      txtDataHoraCabecalho: document.getElementById("txtDataHoraCabecalho"),
      txtSubtituloContagem: document.getElementById("txtSubtituloContagem"),
      inputBusca: document.getElementById("inputBusca"),
      botoesFiltro: document.querySelectorAll(".filter-btn"),
      listaAvisosContainer: document.getElementById("listaAvisosContainer"),
      listaEventosContainer: document.getElementById("listaEventosContainer"),
      contentGrid: document.querySelector(".content-grid"),
      colunaEventos: document.getElementById("colunaEventos"),
      txtAtualizadoHora: document.getElementById("txtAtualizadoHora")
    };

    // Escapar strings contra XSS
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Formatar data em dd/mm
    function formatarDiaMes(dataIsoOuTimestamp) {
      if (!dataIsoOuTimestamp) return "";
      try {
        if (typeof dataIsoOuTimestamp === "string" && dataIsoOuTimestamp.includes("-")) {
          const partes = dataIsoOuTimestamp.split("-");
          if (partes.length === 3) return `${partes[2]}/${partes[1]}`;
        }
        const d = new Date(Number(dataIsoOuTimestamp) || dataIsoOuTimestamp);
        if (!isNaN(d.getTime())) {
          const dia = String(d.getDate()).padStart(2, "0");
          const mes = String(d.getMonth() + 1).padStart(2, "0");
          return `${dia}/${mes}`;
        }
      } catch (e) {}
      return "";
    }

    // Exibir somente a data no cabeçalho (o contador de horário fica apenas no rodapé)
    function atualizarCabecalhoData() {
      const agora = new Date();
      const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

      const diaSemana = diasSemana[agora.getDay()];
      const diaNum = agora.getDate();
      const mesNome = meses[agora.getMonth()];

      if (el.txtDataHoraCabecalho) {
        el.txtDataHoraCabecalho.textContent = `${diaSemana}, ${diaNum} de ${mesNome}`;
      }
    }
    atualizarCabecalhoData();

    let ultimoJsonAvisos = "";
    let ultimoJsonEventos = "";

    // Carregar Avisos da API sem cache
    async function carregarAvisos() {
      try {
        const res = await fetch(`/api/avisos?_t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        const novosAvisos = Array.isArray(data.avisos) ? data.avisos : [];
        const jsonAtual = JSON.stringify(novosAvisos);
        if (jsonAtual !== ultimoJsonAvisos) {
          ultimoJsonAvisos = jsonAtual;
          avisos = novosAvisos;
          renderizarAvisos();
        }
      } catch (err) {
        console.error("Falha ao carregar avisos:", err);
      }
    }

    // Carregar Eventos da API sem cache
    async function carregarEventos() {
      try {
        const res = await fetch(`/api/eventos?_t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        const novosEventos = Array.isArray(data.eventos) ? data.eventos : [];
        const jsonAtual = JSON.stringify(novosEventos);
        if (jsonAtual !== ultimoJsonEventos) {
          ultimoJsonEventos = jsonAtual;
          eventos = novosEventos;
          renderizarEventos();
        }
      } catch (err) {
        console.error("Falha ao carregar eventos:", err);
      }
    }

    // Renderizar lista de avisos
    function renderizarAvisos() {
      const hoje = new Date().toISOString().split("T")[0];
      const ativos = avisos.filter(a => a.ativo !== 0 && (!a.expiracao || a.expiracao >= hoje));

      // Atualizar contagem no subtítulo: "[N] ativos agora"
      if (el.txtSubtituloContagem) {
        const n = ativos.length;
        el.txtSubtituloContagem.textContent = `${n} ativo${n === 1 ? "" : "s"} agora`;
      }

      let filtrados = [...ativos];

      // Filtro de prioridade
      if (filtroAtual === "urgente") {
        filtrados = filtrados.filter(a => String(a.prioridade || "").toLowerCase() === "urgente");
      } else if (filtroAtual === "alta") {
        filtrados = filtrados.filter(a => {
          const p = String(a.prioridade || "").toLowerCase();
          return p === "alta" || p === "atencao";
        });
      } else if (filtroAtual === "informativo") {
        filtrados = filtrados.filter(a => String(a.prioridade || "").toLowerCase() === "informativo");
      }

      // Filtro de busca
      if (termoBusca) {
        const buscaNorm = termoBusca.toLowerCase();
        filtrados = filtrados.filter(a => {
          const tit = (a.titulo || "").toLowerCase();
          const msg = (a.mensagem || "").toLowerCase();
          return tit.includes(buscaNorm) || msg.includes(buscaNorm);
        });
      }

      // Ordenar: urgentes primeiro, depois alta/atenção, depois por data
      const prioridadePeso = { urgente: 1, alta: 2, atencao: 2, informativo: 3, normal: 4 };
      filtrados.sort((a, b) => {
        const pA = prioridadePeso[String(a.prioridade || "normal").toLowerCase()] || 4;
        const pB = prioridadePeso[String(b.prioridade || "normal").toLowerCase()] || 4;
        if (pA !== pB) return pA - pB;
        if (a.expiracao && b.expiracao) return a.expiracao.localeCompare(b.expiracao);
        return (b.id || 0) - (a.id || 0);
      });

      // Se vazio
      if (filtrados.length === 0) {
        el.listaAvisosContainer.innerHTML = `
          <div class="avisos-vazio">
            ${termoBusca || filtroAtual !== "todos" 
              ? "Nenhum aviso encontrado para este filtro ou busca." 
              : "Nenhum comunicado ativo no momento."}
          </div>
        `;
        return;
      }

      el.listaAvisosContainer.innerHTML = filtrados.map(a => {
        const p = String(a.prioridade || "normal").toLowerCase();
        const ehUrgente = p === "urgente";
        const ehAtencao = p === "alta" || p === "atencao";
        const ehInfo = p === "informativo";

        let prioridadeSlug = "normal";
        let pillClasse = "pill-normal";
        let rotuloPill = "Informativo";

        if (ehUrgente) {
          prioridadeSlug = "urgente";
          pillClasse = "pill-urgente";
          rotuloPill = "Urgente";
        } else if (ehAtencao) {
          prioridadeSlug = "atencao";
          pillClasse = "pill-atencao";
          rotuloPill = "Atenção";
        } else if (ehInfo) {
          prioridadeSlug = "informativo";
          pillClasse = "pill-informativo";
          rotuloPill = "Informativo";
        } else {
          prioridadeSlug = "normal";
          pillClasse = "pill-normal";
          rotuloPill = "Geral";
        }

        // Montagem das datas: "Publicado [dd/mm] · até [dd/mm]"
        let textoDatas = "";
        const dataPub = a.criado_em ? formatarDiaMes(a.criado_em) : "";
        const dataExp = a.expiracao ? formatarDiaMes(a.expiracao) : "";

        if (dataPub && dataExp) {
          textoDatas = `Publicado ${dataPub} · até ${dataExp}`;
        } else if (dataExp) {
          textoDatas = `Válido até ${dataExp}`;
        } else if (dataPub) {
          textoDatas = `Publicado em ${dataPub}`;
        }

        const safeTitulo = escapeHtml(a.titulo);
        const safeMsg = escapeHtml(a.mensagem);

        return `
          <article class="aviso-item ${prioridadeSlug}">
            <div class="aviso-meta-row">
              <span class="pill-prioridade ${pillClasse}">${rotuloPill}</span>
              ${textoDatas ? `<span class="aviso-datas-texto">${textoDatas}</span>` : ""}
            </div>
            <h2 class="aviso-titulo">${safeTitulo}</h2>
            <div class="aviso-corpo">${safeMsg}</div>
          </article>
        `;
      }).join("");
    }

    const catMapEventos = {
      avaliacao: { slug: "avaliacao", rotulo: "Avaliação", cor: "#DC2626", bg: "rgba(220, 38, 38, 0.1)" },
      feriado: { slug: "feriado", rotulo: "Feriado", cor: "#16A34A", bg: "rgba(22, 163, 74, 0.1)" },
      sabado: { slug: "sabado", rotulo: "Sábado Letivo", cor: "#D97706", bg: "rgba(217, 119, 6, 0.1)" },
      academico: { slug: "academico", rotulo: "Acadêmico", cor: "#7C3AED", bg: "rgba(124, 58, 237, 0.1)" },
      evento: { slug: "evento", rotulo: "Evento", cor: "#203BA2", bg: "rgba(32, 59, 162, 0.1)" }
    };

    function obterCatEvento(ev) {
      const c = String(ev.categoria || "").toLowerCase();
      if (catMapEventos[c]) return catMapEventos[c];

      const texto = `${ev.titulo || ""} ${ev.descricao || ""}`.toLowerCase();
      if (texto.includes("prova") || texto.includes("avalia") || texto.includes("simulado") || texto.includes("recupera")) {
        return catMapEventos.avaliacao;
      }
      if (texto.includes("feriado") || texto.includes("recesso") || texto.includes("facultativo")) {
        return catMapEventos.feriado;
      }
      if (texto.includes("sábado") || texto.includes("sabado") || texto.includes("letivo")) {
        return catMapEventos.sabado;
      }
      if (texto.includes("conselho") || texto.includes("acadêmico") || texto.includes("planejamento") || texto.includes("unidade")) {
        return catMapEventos.academico;
      }
      return catMapEventos.evento;
    }

    // Renderizar próximos eventos (apenas eventos próximos: até 14 dias / 2 semanas)
    function renderizarEventos() {
      const agora = new Date();
      const hoje = agora.toISOString().split("T")[0];

      const limite = new Date(agora);
      limite.setDate(limite.getDate() + 14); // Janela máxima de 14 dias (2 semanas)
      const dataLimiteIso = limite.toISOString().split("T")[0];

      // Filtrar apenas eventos de hoje até 14 dias para frente
      const futuros = eventos
        .filter(ev => ev.data && ev.data >= hoje && ev.data <= dataLimiteIso)
        .sort((a, b) => (a.data || "").localeCompare(b.data || ""));

      // Se não houver nenhum evento futuro, oculta a coluna lateral e expande os avisos!
      if (futuros.length === 0) {
        if (el.colunaEventos) el.colunaEventos.style.display = "none";
        if (el.contentGrid) el.contentGrid.classList.add("sem-eventos");
        return;
      }

      // Se houver eventos, exibe a coluna lateral
      if (el.colunaEventos) el.colunaEventos.style.display = "flex";
      if (el.contentGrid) el.contentGrid.classList.remove("sem-eventos");

      el.listaEventosContainer.innerHTML = futuros.slice(0, 6).map(ev => {
        const dataFmt = formatarDiaMes(ev.data);
        const safeTitulo = escapeHtml(ev.titulo);
        const safeDesc = escapeHtml(ev.descricao || "CETEP / LNAB");
        const cat = obterCatEvento(ev);

        return `
          <div class="evento-item" style="border-left: 5px solid ${cat.cor};">
            <div class="evento-meta-linha">
              ${dataFmt ? `<span class="evento-data-badge">[${dataFmt}]</span>` : ""}
              <span class="evento-cat-pill" style="color:${cat.cor}; background:${cat.bg};">${cat.rotulo}</span>
            </div>
            <div class="evento-titulo-texto">${safeTitulo}</div>
            <div class="evento-sublinha">${safeDesc}</div>
          </div>
        `;
      }).join("");
    }

    // Atualizar horário do rodapé
    function registrarAtualizacao() {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, "0");
      const m = String(agora.getMinutes()).padStart(2, "0");
      const s = String(agora.getSeconds()).padStart(2, "0");
      if (el.txtAtualizadoHora) {
        el.txtAtualizadoHora.textContent = `Atualizado às ${h}:${m}:${s}`;
      }
    }

    // Habilitar rolagem horizontal suave e arrasto (Desktop Mouse & Mobile Touch)
    const chipsRow = document.querySelector(".filter-chips-row");
    let isMouseDown = false;
    let rowMoved = false;
    let mouseStartX = 0;
    let mouseScrollStart = 0;
    let touchStartX = 0;

    if (chipsRow) {
      // Touch: o navegador já faz rolagem nativa suave com momentum; detectamos movimento para evitar cliques acidentais nos chips durante o swipe
      chipsRow.addEventListener("touchstart", (e) => {
        rowMoved = false;
        touchStartX = e.touches[0].pageX;
      }, { passive: true });

      chipsRow.addEventListener("touchmove", (e) => {
        const dist = Math.abs(e.touches[0].pageX - touchStartX);
        if (dist > 6) {
          rowMoved = true;
        }
      }, { passive: true });

      chipsRow.addEventListener("touchend", () => {
        setTimeout(() => { rowMoved = false; }, 80);
      }, { passive: true });

      // Mouse drag (Desktop)
      chipsRow.addEventListener("mousedown", (e) => {
        isMouseDown = true;
        rowMoved = false;
        mouseStartX = e.pageX;
        mouseScrollStart = chipsRow.scrollLeft;
        chipsRow.style.cursor = "grabbing";
      });

      window.addEventListener("mousemove", (e) => {
        if (!isMouseDown) return;
        const dist = e.pageX - mouseStartX;
        if (Math.abs(dist) > 4) {
          rowMoved = true;
          chipsRow.scrollLeft = mouseScrollStart - dist;
        }
      });

      window.addEventListener("mouseup", () => {
        if (isMouseDown) {
          isMouseDown = false;
          chipsRow.style.cursor = "grab";
          setTimeout(() => { rowMoved = false; }, 80);
        }
      });

      chipsRow.addEventListener("click", (e) => {
        if (rowMoved) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);
    }

    // Filtros por chip
    el.botoesFiltro.forEach(btn => {
      btn.addEventListener("click", () => {
        if (rowMoved) return;
        el.botoesFiltro.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filtroAtual = btn.getAttribute("data-filtro") || "todos";
        renderizarAvisos();
      });
    });

    // Campo de busca
    if (el.inputBusca) {
      el.inputBusca.addEventListener("input", (e) => {
        termoBusca = e.target.value.trim();
        renderizarAvisos();
      });
    }

    // Inicialização
    async function inicializar() {
      await Promise.all([carregarAvisos(), carregarEventos()]);
      registrarAtualizacao();
    }
    inicializar();

    // Auto-atualização periódica em tempo real a cada 3 segundos
    setInterval(async () => {
      await Promise.all([carregarAvisos(), carregarEventos()]);
      registrarAtualizacao();
    }, 3000);

    // Atualização instantânea ao focar ou retornar para a aba
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        carregarAvisos();
        carregarEventos();
        registrarAtualizacao();
      }
    });
    window.addEventListener("focus", () => {
      carregarAvisos();
      carregarEventos();
      registrarAtualizacao();
    });
  </script>
</body>
</html>
