<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 38" width="152" height="38" fill="none">
  <!-- Texto "Presen" em Branco -->
  <text x="0" y="28.5" font-family="'Bricolage Grotesque', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5px">Presen</text>
  
  <!-- 'X' com Visto e Arcos Finos RFID em Branco (Opção 3) -->
  <g transform="translate(104, 3) scale(0.42)">
    <!-- Barra Diagonal Secundária -->
    <line x1="12" y1="28" x2="49" y2="65" stroke="#ffffff" stroke-width="8.8" stroke-linecap="round"/>
    
    <!-- Visto Principal -->
    <path d="M 6 58 L 20 72 L 48 31" stroke="#ffffff" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arcos Finos RFID -->
    <path d="M 50 18 A 14.5 14.5 0 0 1 61 29" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 54 8 A 26.5 26.5 0 0 1 74 28" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>

